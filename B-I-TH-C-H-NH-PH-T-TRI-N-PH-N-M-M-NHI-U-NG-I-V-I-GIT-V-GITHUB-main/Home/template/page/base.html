<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" type="text/css">
    <title>{% block title %}{% endblock %}</title>
    
    <!-- CSS để căn nền và đẩy footer xuống dưới cùng -->
    <style>
        html, body {
            height: 100%;
            background-color: #f6f6f6;
        }
    </style>
</head>
<body>
    <!-- Thư mục container chiếm tối thiểu 95vh -->
    <div class="container-fluid" style="min-height: 95vh;">
        <!-- Row 1: Logo và Tiêu đề -->
        <div class="row">
            <div class="col-sm-2">
    <center><img src="{% static 'image/boruto.jpg' %}" class="responsive-img" style="max-height:150px"/></center>
</div>
            <div class="col-sm-10">
                <center><h1>Blog Làm từ Python Django</h1></center>
            </div>
        </div>
        
        <br/>

        <!-- Row 2: Sidebar (3.1) và Nội dung chính -->
        <div class="row">
            <!-- Sidebar bên trái -->
            <div class="col-sm-2">
                <div class="bs-sliderbar" style="background-color: #ffffff;">
                    <ul class="nav flex-column">
                        <li><a href="/">Thông tin cá nhân</a></li>
                        <li><a href="/blog">Bài viết</a></li>
                        <li><a href="/contact">Liên hệ</a></li>
                    </ul>
                </div>
            </div>

            <!-- Nội dung hiển thị chính -->
            <div class="col-sm-10">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Footer (3.2) -->
    <footer>
        <div class="container-fluid">
            <a href="#">Facebook</a> | <a href="#">Twitter</a> | <a href="#">Google</a>
        </div>
    </footer>
</body>
</html>
